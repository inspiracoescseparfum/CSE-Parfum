document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        const bytes = new Uint8Array(binaryStr.length);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

); backdrop-filter: blur(12px); border-bottom: 1px solid #e6e1d6; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 22px 44px\">\n    <nav data-r=\"nav\" style=\"display: flex; gap: 30px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #6a645b\">\n      <a href=\"#catalogo\" style=\"color: #6a645b\">Catálogo<\u002Fa>\n      <a href=\"#frasco\" style=\"color: #6a645b\">O frasco<\u002Fa>\n      <a href=\"https://wa.me/5514996878508\" target=\"_blank\" style=\"color: #6a645b\">Contato<\u002Fa>\n    <\u002Fnav>\n    <div data-r=\"logo\" style=\"text-align: center\">\n      <div style=\"font-family: Marcellus, serif; font-size: 25px; letter-spacing: .34em; text-transform: uppercase; color: #14120f; padding-left: .34em\">CSE Parfum<\u002Fdiv>\n      <div style=\"font-size: 9px; letter-spacing: .34em; text-transform: uppercase; color: #8b8478; margin-top: 6px; padding-left: .34em\">Fragrâncias inspiradas<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; justify-content: flex-end\">\n      <button sc-camel-on-click=\"{{ openCart }}\" style=\"display: flex; align-items: center; gap: 12px; background: transparent; border: 1px solid #dcd6c8; color: #1a1815; font-family: inherit; font-size: 11px; font-weight: 400; letter-spacing: .2em; text-transform: uppercase; padding: 12px 20px; cursor: pointer\" style-hover=\"border-color: #a37c35; color: #a37c35\">\n        Sacola\n        <span style=\"font-family: Marcellus, serif; font-size: 13px; color: #a37c35\">{{ cartCount }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section data-r=\"hero\" style=\"border-bottom: 1px solid #e6e1d6\">\n    <div data-r=\"hero-copy\" style=\"max-width: 1240px; margin: 0 auto; padding: 116px 44px 104px; display: flex; flex-direction: column\">\n      <div style=\"display: flex; align-items: center; gap: 14px; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: #a37c35; margin-bottom: 30px\">\n        <span style=\"width: 44px; height: 1px; background: #a37c35; display: block\"><\u002Fspan>\n        Eau de parfum · 50 ml\n      <\u002Fdiv>\n      <h1 style=\"font-family: Marcellus, serif; font-weight: 400; font-size: clamp(38px, 5.4vw, 68px); line-height: 1.08; margin: 0; color: #14120f\">Sua fragrância favorita com <span style=\"color: #a37c35\">alta fixação<\u002Fspan><\u002Fh1>\n      <p style=\"max-width: 480px; margin: 32px 0 0; font-size: 16.5px; line-height: 1.8; color: #6a645b\">Desenvolvemos inspirações olfativas incrivelmente fiéis aos grandes clássicos e lançamentos da perfumaria mundial.<\u002Fp>\n      <div style=\"display: flex; gap: 16px; margin-top: 44px\">\n        <a href=\"#catalogo\" style=\"background: #a37c35; color: #fffdf8; font-size: 11.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; padding: 18px 38px\" style-hover=\"background: #8a6728; color: #fffdf8\">Ver catálogo<\u002Fa>\n        <a href=\"https://wa.me/5514996878508\" target=\"_blank\" style=\"border: 1px solid #dcd6c8; color: #1a1815; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; padding: 18px 34px\" style-hover=\"border-color: #a37c35; color: #a37c35\">Falar no WhatsApp<\u002Fa>\n      <\u002Fdiv>\n      <div data-r=\"hero-stats\" style=\"display: flex; gap: 48px; margin-top: 62px; flex-wrap: wrap; padding-top: 28px; border-top: 1px solid #e6e1d6\">\n        <div>\n          <div style=\"font-family: Marcellus, serif; font-size: 22px; color: #14120f\">50 ml<\u002Fdiv>\n          <div style=\"font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #8b8478; margin-top: 7px\">Frasco padrão<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: Marcellus, serif; font-size: 22px; color: #14120f\">R$ 60<\u002Fdiv>\n          <div style=\"font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #8b8478; margin-top: 7px\">Preço único<\u002Fdiv>\n        <\u002Fdiv 3QRx-bSz7gqMfBkhJ5kd0udU&s=10\", true, \"Um clássico absoluto. Notas cítricas de maçã e ameixa na saída evoluem para um coração de canela e jasmim, com um fundo misterioso de cedro e baunilha.\"],\n  [6, \"Fakhar Rose\", \"feminino\", \"Floral • Frutal Suave\", \"R$ 350\", \"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRInkuVyrG-tAAiB4cAm5oJVFogQuPix-iqk68GPu0BtXPTO3Is2tDKzm8&s=10\", true, \"Exuberante e romântico. Destaca a delicadeza luxuosa das flores brancas, tuberosa e rosas, com uma base levemente amadeirada que exala elegância.\"],\n  [7, \"Lady Million\", \"feminino\", \"Frutal • Doce Floral\", \"R$ 939\", \"https://fimgs.net/mdimg/perfume/o.9045.jpg\", true, \"Luxuoso e radiante. Inicia com um toque de framboesa, abrindo para um buquê de néroli e jasmim, finalizando com o rastro sensual do mel e patchouli.\"],\n  [8, \"Fame\", \"feminino\", \"Frutal • Tropical Doce\", \"R$ 1.240\", \"https://www.sephora.com.br/on/demandware.static/-/Sites-masterCatalog_Sephora/pt_BR/dw167b8a94/images/hi-res-BR/3349668594412.1_1500px.jpg\", true, \"Tropical, vanguardista e irresistível. Traz o frescor exótico da manga, a pureza do jasmim e a sensualidade cremosa do incenso e sândalo.\"],\n  [9, \"Green Irish Tweed\", \"masculino\", \"Amadeirado • Verde Cítrico\", \"R$ 2.900\", \"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGKM2dBbeDMIwHA97Rt5rQIjjNndxcXEpHTVnDZZhnmA&s=10\", true, \"Evoca a frescura do campo e a sofisticação da realeza. Notas clássicas de limão, verbena, folhas de violeta e sândalo.\"],\n  [10, \"Sauvage Dior Elixir\", \"masculino\", \"Amadeirado • Especiado Quente\", \"R$ 1.943\", \"https://lojadior.vtexassets.com/arquivos/ids/204561-640-800/3348901786997_0-thumbnew-sauvage-elixir.jpg?v=639131630767970000\", true, \"Extremamente concentrado e noturno. Uma mistura inebriante de toranja picante, noz-moscada, lavanda e madeiras ricas com um toque de alcaçuz.\"],\n  [11, \"Turathi Blue Afnan\", \"masculino\", \"Cítrico • Aromático Fresco\", \"R$ 380\", \"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsTliMLtaOaICJcNZRC7iNG5kCO-xV7F1E8ffYjeZWtQ&s=10\", true, \"Vibrante e fresco. Combina uma explosão de cítricos com notas amadeiradas de fundo, âmbar e especiarias elegantes para o dia a dia.\"],\n  [12, \"Scandal By Night\", \"feminino\", \"Doce • Mel e Tuberosa\", \"R$ 1.004\", \"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWrEIEVFlqf8kcHCfLNf7zaCuFQ0HD2zILNH1AOv7o9kmyhI09-vbHaVA&s=10\", true, \"Escandalosamente sedutor. A doçura marcante do mel e tuberosa se misturam à fava tonka e sândalo, criando uma aura noturna irresistível.\"],\n  [13, \"Invictus Victory Elixir\", \"masculino\", \"Doce • Amadeirado Baunilha\", \"R$ 971\", \"https://epocacosmeticos.vteximg.com.br/arquivos/ids/551843-800-800/3349668614516.1--1-.jpg?v=638204475026200000\", true, \"O perfume de um vencedor. Traz o frescor intenso do lavandim colidindo com o calor do incenso, baunilha e fava tonka.\"],\n  [14, \"Royal Amber\", \"unissex\", \"Doce • Oriental Baunilha\", \"R$ 1.300\", \"https://fimgs.net/mdimg/perfume-thumbs/375x500.69362.jpg\", true, \"Luxo em forma de perfume. Combina notas doces e ricas de âmbar, melão, abacaxi e baunilha, perfeitamente equilibradas em uma base de almíscar.\"],\n  [15, \"Asad Lataffa\", \"masculino\", \"Amadeirado • Especiado Quente\", \"R$ 300\", \"https://epocacosmeticos.vteximg.com.br/arquivos/ids/1292446-800-800/17581402186111.jpg?v=638998664977700000\", true, \"Marcante e opulento. Traz pimenta preta, notas frutadas de abacaxi e café, com um fundo intenso de madeiras secas e baunilha.\"],\n  [16, \"Sauvage Dior\", \"masculino\", \"Aromático • Cítrico Fresco\", \"R$ 1.115\", \"https://www.sephora.com.br/dw/image/v2/BFJC_PRD/on/demandware.static/-/Sites-masterCatalog_Sephora/pt_BR/dw86e71062/images/hi-res-BR/p1_100ml_3348901368247_1500px.jpg?sw=1200&sh=1200&sm=fit\", true, \"Atemporal e selvagem. O frescor radiante da bergamota da Calábria é fortemente contrastado com o rastro amadeirado, poderoso e viril do ambroxan.\"],\n  [17, \"Prada Paradoxe\", \"feminino\", \"Floral • Âmbar Suave\", \"R$ 1.036\", \"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcStdYiOP8x3VVT3YMKytMwcY1rf63ULlab4pqWn7DEodQ&s\", true, \"Moderno, vibrante e feminino. Reinventa os clássicos combinando frescor do néroli, notas de pera e um rastro vibrante de almíscar e âmbar.\"],\n  [18, \"Invictus\", \"masculino\", \"Amadeirado • Aquático\", \"R$ 649\", \"https://www.sephora.com.br/dw/image/v2/BFJC_PRD/on/demandware.static/-/Sites-masterCatalog_Sephora/pt_BR/dwbc6f2ceb/images/hi-res-BR/_3BFB9D5A-8F67-4E2E-B35F-8CEC17DAA893__Paco-Rabanne-Invictus_500px.jpg?sw=1200&sh=1200&sm=fit\", true, \"Vencedor por natureza. Uma fragrância extremamente fresca e enérgica, que une notas marinhas, casca de toranja e um fundo marcante de madeira de guaiaco e âmbar cinza.\"],\n  [19, \"Coco Mademoiselle\", \"feminino\", \"Oriental • Fresco\", \"R$ 1.415\", \"https://www.chanel.com/images/t_one/w_0.51,h_0.51,c_crop/q_auto:good,f_autoplus,fl_lossy,dpr_1.1/w_1240/coco-mademoiselle-eau-de-parfum-spray-3-4fl-oz--packshot-default-116520-9564892495902.jpg\", false, \"Um perfume icônico, elegante e marcante. Combina a vivacidade cintilante das laranjas com a transparência do jasmim e a sofisticação moderna do patchouli.\"],\n  [20, \"Eclaire Lataffa\", \"feminino\", \"Oriental • Gourmand\", \"R$ 420\", \"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQRGHDrx1fwXg5TVMphvqxcJxqmQvpapbM_7d1maZNvon46ePvJtSdBUbJ&s=10\", false, \"Uma verdadeira sobremesa de luxo. Traz notas reconfortantes e deliciosas de caramelo, leite e mel, envolvidas por um toque suave de flores brancas e baunilha.\"],\n  [21, \"One Million Rabanne\", \"masculino\", \"Amadeirado • Especiado\", \"R$ 560\", \"https://img.lojasrenner.com.br/item/546594103/zoom/1.jpg\", false, \"Ousado, marcante e luxuoso. Combina notas de topo frescas de menta e mandarina com um coração quente de canela e especiarias, finalizado com um fundo intenso de couro e âmbar.\"],\n  [22, \"Hacivat Nishane\", \"masculino\", \"Chipre • Frutado\", \"R$ 2.200\", \"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcGsMHAHhIMTryj9IVMo7HMtqLr1IrdqTv-E86bOEPL4LEGsGPogu3G344&s=10\", false, \"Sofisticado, fresco e imponente. Uma explosão elegante de abacaxi suculento e bergamota na saída, evoluindo para um coração amadeirado com patchouli e jasmim, e um fundo marcante de musgo de carvalho.\"]\n];\n\nconst RES = (typeof window !== \"undefined\" && window.__resources) || {};\nconst PRODUCTS = RAW.map(([id, name, category, family, originalPrice, image, available, description]) =>\n  ({ id, name, category, family, originalPrice, image: RES[\"p\" + id] || image, available, description, price: 60 }));\n\nconst FILTERS = [\n  [\"all\", \"Todos\"], [\"masculino\", \"Masculinos\"], [\"feminino\", \"Femininos\"], [\"unissex\", \"Unissex\"]\n];\n\nconst brl = n => n.toFixed(2).replace(\".\", \",\");\n\nclass Component extends DCLogic {\n  state = { category: \"all\", query: \"\", cart: [], cartOpen: false, modalId: null };\n\n  add = (id) => {\n    this.setState(s => {\n      const found = s.cart.find(i => i.id === id);\n      const cart = found\n        ? s.cart.map(i => i.id === id ? { ...i, quantity: i.quantity + 1 } : i)\n        : [...s.cart, { id, quantity: 1 }];\n      return { cart, cartOpen: true, modalId: null };\n    });\n  };\n\n  bump = (id, d) => this.setState(s => ({\n    cart: s.cart.map(i => i.id === id ? { ...i, quantity: i.quantity + d } : i).filter(i => i.quantity > 0)\n  }));\n\n  decorate(p, big) {\n    return {\n      ...p,\n      categoryLabel: p.category,\n      stockLabel: p.available ? \"Disponível\" : \"Esgotado\",\n      stockColor: p.available ? \"#4f7538\" : \"#a2483a\",\n      btnLabel: p.available ? \"Adicionar à sacola\" : \"Esgotado\",\n      btnBg: p.available ? \"#a37c35\" : \"transparent\",\n      btnColor: p.available ? \"#fffdf8\" : \"#8b8478\",\n      btnBorder: p.available ? \"#a37c35\" : \"#dcd6c8\",\n      cursor: p.available ? \"pointer\" : \"not-allowed\",\n      disabled: !p.available,\n      add: p.available ? () => this.add(p.id) : undefined,\n      open: () => this.setState({ modalId: p.id })\n    };\n  }\n\n  checkout = () => {\n    const { cart } = this.state;\n    if (!cart.length) return;\n    let msg = \"Olá, CSE Parfum! Gostaria de fazer o seguinte pedido:%0A%0A\";\n    let count = 0, total = 0;\n    cart.forEach(i => {\n      const p = PRODUCTS.find(x => x.id === i.id);\n      count += i.quantity; total += i.quantity * 60;\n      msg += `▪️ *${i.quantity}x* ${p.name} (inspiração) - R$ ${brl(i.quantity * 60)}%0A`;\n    });\n    const discount = Math.floor(count / 3) * 15;\n    if (discount) msg += `%0A*Desconto do combo:* -R$ ${brl(discount)}%0A`;\n    msg += `%0A*Total do pedido: R$ ${brl(total - discount)}*%0A%0APode confirmar a disponibilidade e o prazo de entrega para mim?`;\n    window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, \"_blank\");\n  };\n\n  renderVals() {\n    const { category, query, cart, cartOpen, modalId } = this.state;\n    const q = query.trim().toLowerCase();\n    const visible = PRODUCTS\n      .filter(p => (category === \"all\" || p.category === category) && p.name.toLowerCase().includes(q))\n      .sort((a, b) => Number(b.available) - Number(a.available))\n      .map(p => this.decorate(p));\n\n    const count = cart.reduce((n, i) => n + i.quantity, 0);\n    const discount = Math.floor(count / 3) * 15;\n    const total = count * 60 - discount;\n    const rest = count % 3;\n    const missing = 3 - rest;\n    const modalP = modalId ? PRODUCTS.find(p => p.id === modalId) : null;\n\n    return {\n      visible,\n      empty: visible.length === 0,\n      query,\n      onSearch: e => this.setState({ query: e.target.value }),\n      filters: FILTERS.map(([key, label]) => ({\n        label,\n        select: () => this.setState({ category: key }),\n        bg: category === key ? \"#a37c35\" : \"transparent\",\n        color: category === key ? \"#fffdf8\" : \"#6a645b\",\n        border: category === key ? \"#a37c35\" : \"#dcd6c8\"\n      })),\n      cartCount: count,\n      cartOpen,\n      openCart: () => this.setState({ cartOpen: true }),\n      closeCart: () => this.setState({ cartOpen: false }),\n      hasItems: count > 0,\n      cartEmpty: count === 0,\n      cartItems: cart.map(i => ({\n        ...i,\n        name: PRODUCTS.find(p => p.id === i.id).name,\n        inc: () => this.bump(i.id, 1),\n        dec: () => this.bump(i.id, -1)\n      })),\n      hasDiscount: discount > 0,\n      discountLabel: brl(discount),\n      totalLabel: brl(total),\n      discountColor: rest === 0 && count > 0 ? \"#4f7538\" : \"#a37c35\",\n      discountMessage: rest === 0 && count > 0\n        ? `Desconto de R$ ${brl(discount)} aplicado ao seu pedido.`\n        : `Falta ${missing} ${missing === 1 ? \"perfume\" : \"perfumes\"} para ganhar R$ 15,00 de desconto.`,\n      checkout: this.checkout,\n      modal: modalP ? this.decorate(modalP, true) : null,\n      closeModal: () => this.setState({ modalId: null }),\n      stop: e => e.stopPropagation()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
